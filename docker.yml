---
- name: Install and configure Docker
  hosts: 127.0.0.1
  connection: local
  become: false

  vars:

    debug_display: true

    docker_group: docker
    docker_user: "{{ ansible_user | default(ansible_facts['env']['USER']) }}"

    i_am_root: "{{ docker_user == 'root' }}"
    docker_user_is_root: "{{ docker_user == 'root' }}"

  tasks:

    - name: Display user
      ansible.builtin.debug:
        msg:
          env_user: "{{ ansible_facts['env']['USER'] }}"
          i_am_root: "{{ i_am_root }}"
          docker_user: "{{ docker_user }}"
          docker_user_is_root: "{{ docker_user_is_root }}"
      when: debug_display

    - name: Display env
      ansible.builtin.debug:
        msg:
          env: "{{ ansible_facts['env'] }}"
      when: debug_display

    - name: Check whether Docker executable exists
      ansible.builtin.command:
        cmd: which docker
      register: docker_which
      changed_when: false
      failed_when: false

    - name: Check whether Docker is installed
      ansible.builtin.set_fact:
        docker_is_installed: "{{ docker_which.rc == 0 }}"

    - name: Do Docker installation
      become: "{{ not i_am_root }}"
      when: not docker_is_installed
      block:
        - name: Install Docker convenience script dependencies
          ansible.builtin.package:
            name:
              - curl
              - ca-certificates
            state: present

        - name: Download Docker convenience script
          ansible.builtin.get_url:
            url: https://get.docker.com
            dest: /tmp/get-docker.sh
            mode: "0755"

        - name: Run Docker convenience script
          ansible.builtin.command:
            cmd: /tmp/get-docker.sh
          changed_when: true

        - name: Start and enable Docker
          ansible.builtin.systemd:
            name: docker
            enabled: true
            state: started

    - name: Ensure Docker group exists and add user to it
      become: "{{ not i_am_root }}"
      block:
        - name: Create Docker group
          ansible.builtin.group:
            name: "{{ docker_group }}"
            state: present

        - name: Add Docker user to Docker group
          when: not docker_user_is_root
          ansible.builtin.user:
            name: "{{ docker_user }}"
            groups: "{{ docker_group }}"
            append: true