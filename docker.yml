---
- name: Install and configure Docker
  hosts: 127.0.0.1
  connection: local
  become: false

  vars:

    debug_display: true

    docker_group: docker
    docker_user: "{{ ansible_user | default(ansible_facts['env']['USER']) }}"

    i_am_root: "{{ docker_user == 'root' }}"

    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf

    docker_os_family_map:
      Debian: debian
      Ubuntu: debian
      Kali: debian
      RedHat: redhat
      Suse: redhat
      SUSE: redhat

    docker_arch: "{{ docker_arch_map.get(ansible_facts['architecture'], '') }}"
    docker_os_family: "{{ docker_os_family_map.get(ansible_facts['os_family'], '') }}"

  pre_tasks:
    - name: Verify architecture and distribution are supported
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] in docker_arch_map
          - ansible_facts['os_family'] in docker_os_family_map
        fail_msg: >-
          Unsupported platform: architecture={{ ansible_facts['architecture'] }},
          os_family={{ ansible_facts['os_family'] }}

  tasks:

    - name: Display user
      ansible.builtin.debug:
        msg:
          env_user: "{{ ansible_facts['env']['USER'] }}"
          docker_user: "{{ docker_user }}"
          i_am_root: "{{ i_am_root }}"
      when: debug_display

    - name: Display env
      ansible.builtin.debug:
        msg:
          env_user: "{{ ansible_facts['env'] }}"
      when: debug_display

    - name: Do Docker installation
      become: "{{ not i_am_root }}"
      block:
      - name: Install Docker for Debian-family systems
        when: ansible_facts['os_family'] == "Debian"
        block:
        - name: Install Debian Docker prerequisites
          ansible.builtin.apt:
            name:
              - apt-transport-https
              - ca-certificates
              - gnupg
              - lsb-release
            state: present
            update_cache: true

        - name: Create Debian APT keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"
          when: ansible_facts['os_family'] == "Debian"

        - name: Download Docker Debian signing key
          ansible.builtin.get_url:
            url: "https://download.docker.com/linux/{{ docker_os_family }}/gpg"
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"
          when: ansible_facts['os_family'] == "Debian"

        - name: Configure Docker APT repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/{{ docker_os_family }}
              {{ 'bookworm' if ansible_facts['distribution'] == 'Kali' else ansible_facts['distribution_release'] }} stable
            filename: docker
            state: present
            update_cache: true

        - name: Install Docker on Debian-family systems
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: true

      - name: Install Docker for Red Hat-family systems
        when: ansible_facts['os_family'] == "RedHat"
        block:
        # Red Hat-family: RHEL, Rocky, Alma, Fedora, Oracle Linux
        - name: Install Red Hat Docker prerequisites
          ansible.builtin.dnf:
            name:
              - ca-certificates
              - dnf-plugins-core
            state: present

        - name: Remove conflicting Docker packages
          ansible.builtin.dnf:
            name:
              - docker
              - docker-client
              - docker-client-latest
              - docker-common
              - docker-latest
              - docker-latest-logrotate
              - docker-logrotate
              - docker-engine
              - podman
              - runc
            state: absent
          failed_when: false

        - name: Configure Docker DNF repository
          ansible.builtin.yum_repository:
            name: docker-ce-stable
            description: Docker CE Stable
            baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
            enabled: true
            gpgcheck: true
            gpgkey: https://download.docker.com/linux/centos/gpg
            file: docker-ce

        - name: Install Docker on Red Hat-family systems
          ansible.builtin.dnf:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
              - docker-compose-plugin
            state: present
            update_cache: true

      - name: Start and enable Docker
        ansible.builtin.systemd:
          name: docker
          enabled: true
          state: started

      - name: Create Docker group
        ansible.builtin.group:
          name: "{{ docker_group }}"
          state: present

      - name: Add Docker user to Docker group
        ansible.builtin.user:
          name: "{{ docker_user }}"
          groups: "{{ docker_group }}"
          append: true
        when: i_am_root == false