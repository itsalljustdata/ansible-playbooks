---
- name: Install and configure cloudflared tunnel
  hosts: 127.0.0.1
  connection: local
  become: true
  vars:
    debug_display: true

    this_user: "{{ ansible_facts['env']['USER'] }}"
    i_am_root: "{{ this_user == 'root' }}"

    stack_name: "cloudflared"
    compose_folder: "/mnt/data/compose/{{ stack_name }}"
    compose_file: "{{ compose_folder }}/compose.yaml"
    compose_env_file: "{{ compose_folder }}/.env"

    cloudflared_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
    cloudflared_arch: "{{ cloudflared_arch_map[ansible_facts['architecture']] }}"
    cloudflared_package_format_map:
      Debian: deb
      RedHat: rpm
      SUSE: rpm
      Suse: rpm
    cloudflared_package_format: "{{ cloudflared_package_format_map.get(ansible_facts['os_family'], '') }}"
    cloudflared_package_url: "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-{{ cloudflared_arch }}.{{ cloudflared_package_format }}"
    cloudflared_package_path: "/tmp/cloudflared.{{ cloudflared_package_format }}"

# services:
#   cloudflared:
#     container_name: cloudflared
#     image: zoeyvid/cloudflared
#     restart: always
#     network_mode: host
#     environment:
#       - "TZ=Europe/Berlin"
#       - "TUNNEL_TOKEN=your-cloudflared-tunnel-token"

  tasks:

    - name: Display debug information
      ansible.builtin.debug:
        msg:
          architecture: "{{ ansible_facts['architecture'] }}"
          os_family: "{{ ansible_facts['os_family'] }}"
          i_am_root: "{{ i_am_root }}"
      when: debug_display
    - name: Display token
      ansible.builtin.debug:
        msg:
          tunnel_token: "{{ tunnel_token }}"
      when:
        - debug_display
        - tunnel_token is defined
        - tunnel_token | trim | length > 0

    - name: Display debug information
      ansible.builtin.debug:
        msg:
          env: "{{ ansible_facts['env'] }}"
      when: debug_display

    - name: Check whether Docker executable exists
      ansible.builtin.command:
        cmd: which docker
      register: docker_which
      changed_when: false
      failed_when: false

    - name: Check whether Docker is installed
      ansible.builtin.set_fact:
        docker_is_installed: "{{ docker_which.rc == 0 }}"
      
    - name: Require Docker
      ansible.builtin.assert:
        that:
          - docker_is_installed
        fail_msg: "Docker is required by the cloudflared Ansible playbook but 'docker' was not found on PATH."

    - name: Get system timezone
      ansible.builtin.command:
        cmd: timedatectl show --property=Timezone --value
      register: system_timezone_result
      changed_when: false
      failed_when: false

    - name: Set system timezone fact
      ansible.builtin.set_fact:
        system_timezone: "{{ system_timezone_result.stdout | default('') | trim }}"

    - name: List Docker Compose stacks
      ansible.builtin.command:
        cmd: docker compose ls -a
      register: docker_compose_stacks
      changed_when: false
      failed_when: false

    - name: Check whether cloudflared Compose stack exists
      ansible.builtin.set_fact:
        cloudflared_compose_exists: "{{ docker_compose_stacks.stdout is regex('(?im)^cloudflared\\s') }}"

    - name: Create cloudflared docker 
      when: not cloudflared_compose_exists
      block:
      - name: Look for cloudflared compose folder
        ansible.builtin.stat:
          path: "{{ compose_folder }}"
        register: cloudflared_compose_folder

      - name: Create cloudflared Compose folder
        ansible.builtin.file:
          path: "{{ compose_folder }}"
          state: directory
          mode: "0755"
        when: not cloudflared_compose_folder.stat.exists

      - name: Create cloudflared Compose file
        ansible.builtin.copy:
          dest: "{{ compose_file }}"
          content: |
            name: {{ stack_name }}
            services:
              cloudflared:
                container_name: {{ stack_name }}
                image: cloudflared/cloudflared
                restart: always
                network_mode: host
                environment:
                  TZ: "{{ system_timezone }}"
                  TUNNEL_TOKEN: "{{ tunnel_token }}"

      - name: Start cloudflared Compose stack
        ansible.builtin.command:
          cmd: docker compose -f "{{ compose_file }}" up -d
        when: 
          - tunnel_token is defined
          - tunnel_token | trim | length > 0
        failed_when: false

      - name: Do not start cloudflared Compose stack
        ansible.builtin.debug:
          msg: "Cloudflared Compose stack will not be started because tunnel_token is not defined or empty."
        when: 
          - tunnel_token is not defined or tunnel_token | trim | length == 0
        failed_when: false
