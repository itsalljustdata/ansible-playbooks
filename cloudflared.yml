---
- name: Install and configure cloudflared tunnel
  hosts: 127.0.0.1
  connection: local
  vars:
    debug_display: true

    this_user: "{{ ansible_facts['env']['USER'] }}"

    stack_name: "cloudflared"
    compose_root_folder: "/mnt/data/compose"
    compose_folder: "{{ compose_root_folder }}/{{ stack_name }}"
    compose_filename: "compose.yaml"
    compose_file: "{{ compose_folder }}/{{ compose_filename }}"
    compose_env_filename: ".env"
    compose_env_file: "{{ compose_folder }}/{{ compose_env_filename }}"

    the_tunnel_token: "{{ tunnel_token | default('** UNDEFINED **') }}"

  tasks:

    - name: Display debug information
      ansible.builtin.debug:
        msg:
          compose_folder: "{{ compose_folder }}"
          compose_env_file: "{{ compose_env_file }}"
          compose_file: "{{ compose_file }}"

      when: debug_display
    - name: Display token
      ansible.builtin.debug:
        msg:
          tunnel_token: "{{ tunnel_token }}"
      when:
        - debug_display
        - tunnel_token is defined
        - tunnel_token | trim | length > 0

    - name: Display debug information
      ansible.builtin.debug:
        msg:
          env: "{{ ansible_facts['env'] }}"
      when: debug_display

    - name: Get target user account details
      ansible.builtin.getent:
        database: passwd
        key: "{{ this_user }}"

    - name: Set cloudflared PUID and PGID facts
      ansible.builtin.set_fact:
        the_puid: "{{ ansible_facts.getent_passwd[this_user][1] }}"
        the_pgid: "{{ ansible_facts.getent_passwd[this_user][2] }}"
      
    - name: Check whether Docker executable exists
      ansible.builtin.command:
        cmd: which docker
      register: docker_which
      changed_when: false
      failed_when: false

    - name: Check whether Docker is installed
      ansible.builtin.set_fact:
        docker_is_installed: "{{ docker_which.rc == 0 }}"
      
    - name: Require Docker
      ansible.builtin.assert:
        that:
          - docker_is_installed
        fail_msg: "Docker is required by the cloudflared Ansible playbook but 'docker' was not found on PATH."

    - name: Get system timezone
      ansible.builtin.command:
        cmd: timedatectl show --property=Timezone --value
      register: system_timezone_result
      changed_when: false
      failed_when: false

    - name: Set system timezone fact
      ansible.builtin.set_fact:
        system_timezone: "{{ system_timezone_result.stdout | default('Etc/UTC') | trim }}"

    - name: List Docker Compose stacks
      ansible.builtin.command:
        cmd: docker compose ls -a --format json
      register: docker_compose_stacks
      changed_when: false
      failed_when: false

    - name: Parse Docker Compose stacks
      ansible.builtin.set_fact:
        docker_compose_stack_list: "{{ docker_compose_stacks.stdout | from_json }}"

    - name: Initialize cloudflared Compose stack
      ansible.builtin.set_fact:
        cloudflared_compose_stack: null

    - name: Find cloudflared Compose stack
      ansible.builtin.set_fact:
        cloudflared_compose_stack: "{{ item }}"
      loop: "{{ docker_compose_stack_list }}"
      when: item.Name | default('') == stack_name

    - name: Display debug information
      ansible.builtin.debug:
        msg:
          cloudflared_compose_stack: "{{ cloudflared_compose_stack }}"
      when: debug_display

    - name: Check whether cloudflared Compose stack exists
      ansible.builtin.set_fact:
        cloudflared_compose_exists: "{{ cloudflared_compose_stack is not none }}"

    - name: Drop existing stack
      when: cloudflared_compose_exists
      ansible.builtin.command:
        cmd: docker compose -f "{{ cloudflared_compose_stack.ConfigFiles }}" down
      register: drop_stack_result
      changed_when: drop_stack_result.rc == 0
      failed_when: drop_stack_result.rc != 0

    - name: Create cloudflared docker 
      block:
      - name: Look for cloudflared compose folder
        become: true
        ansible.builtin.stat:
          path: "{{ compose_folder }}"
        register: cloudflared_compose_folder

      - name: Create cloudflared Compose folder
        become: true
        ansible.builtin.file:
          path: "{{ compose_folder }}"
          state: directory
          mode: "0755"
          recurse: true
        when: not cloudflared_compose_folder.stat.exists

      - name: Ensure correct ownership of Compose folder
        become: true
        ansible.builtin.file:
          path: "{{ compose_folder }}"
          owner: "{{ this_user }}"
          group: "{{ this_user }}"
          recurse: true

      - name: Create cloudflared Compose file
        ansible.builtin.copy:
          dest: "{{ compose_file }}"
          mode: "0640"
          content: |
            name: {{ stack_name }}
            services:
              cloudflared:
                container_name: {{ stack_name }}
                image: cloudflare/cloudflared
                restart: always
                network_mode: host
                env_file: "./{{ compose_env_filename }}"
                command: "tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}"

      - name: Create cloudflared env file
        ansible.builtin.copy:
          dest: "{{ compose_env_file }}"
          mode: "0600"
          content: |
            TZ="{{ system_timezone }}"
            TUNNEL_TOKEN="{{ the_tunnel_token }}"
            PUID="{{ the_puid }}"
            PGID="{{ the_pgid }}"

      - name: Start cloudflared Compose stack
        ansible.builtin.command:
          cmd: bash -c "cd \"{{ compose_folder }}\" && docker compose up -d"
        when: 
          - tunnel_token is defined
          - tunnel_token | trim | length > 0
        register: create_stack_result
        changed_when: create_stack_result.rc == 0
        failed_when: create_stack_result.rc != 0
