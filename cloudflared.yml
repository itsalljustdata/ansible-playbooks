---
- name: Install and configure cloudflared tunnel
  hosts: 127.0.0.1
  connection: local
  become: true
  vars:
    debug_display: true

    i_am_root: "{{ ansible_facts['env']['USER'] == 'root' }}"

    cloudflared_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
    cloudflared_arch: "{{ cloudflared_arch_map[ansible_facts['architecture']] }}"
    cloudflared_package_format_map:
      Debian: deb
      RedHat: rpm
      SUSE: rpm
      Suse: rpm
    cloudflared_package_format: "{{ cloudflared_package_format_map.get(ansible_facts['os_family'], '') }}"
    cloudflared_package_url: "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-{{ cloudflared_arch }}.{{ cloudflared_package_format }}"
    cloudflared_package_path: "/tmp/cloudflared.{{ cloudflared_package_format }}"

# services:
#   cloudflared:
#     container_name: cloudflared
#     image: zoeyvid/cloudflared
#     restart: always
#     network_mode: host
#     environment:
#       - "TZ=Europe/Berlin"
#       - "TUNNEL_TOKEN=your-cloudflared-tunnel-token"

  tasks:

    - name: Display debug information
      ansible.builtin.debug:
        msg:
          architecture: "{{ ansible_facts['architecture'] }}"
          os_family: "{{ ansible_facts['os_family'] }}"
          i_am_root: "{{ i_am_root }}"
      when: debug_display
    - name: Display token
      ansible.builtin.debug:
        msg:
          tunnel_token: "{{ tunnel_token }}"
      when:
        - debug_display
        - tunnel_token is defined
        - tunnel_token | trim | length > 0

    - name: Display debug information
      ansible.builtin.debug:
        msg:
          env: "{{ ansible_facts['env'] }}"
      when: debug_display

    - name: Verify architecture and distribution are supported
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] in cloudflared_arch_map
          - cloudflared_package_format != ''
        fail_msg: >-
          Unsupported platform: architecture={{ ansible_facts['architecture'] }},
          os_family={{ ansible_facts['os_family'] }}

    - name: Download cloudflared package
      ansible.builtin.get_url:
        url: "{{ cloudflared_package_url }}"
        dest: "{{ cloudflared_package_path }}"
        mode: "0644"

    - name: Install cloudflared package
      ansible.builtin.package:
        name: "{{ cloudflared_package_path }}"
        state: present
        disable_gpg_check: true

    - name: Check if cloudflared service is already installed
      ansible.builtin.stat:
        path: /etc/systemd/system/cloudflared.service
      register: cloudflared_service_file

    - name: Install cloudflared as a systemd service
      ansible.builtin.command:
        cmd: "cloudflared service install {{ tunnel_token }}"
      when:
        - tunnel_token is defined
        - tunnel_token | trim | length > 0
        - not cloudflared_service_file.stat.exists
      no_log: true

    - name: Ensure cloudflared service is started and enabled
      ansible.builtin.systemd:
        name: cloudflared
        state: started
        enabled: true
      when:
        - tunnel_token is defined
        - tunnel_token | trim | length > 0