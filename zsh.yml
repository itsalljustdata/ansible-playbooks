---
- name: Install zsh
  hosts: 127.0.0.1
  connection: local
  become: true

  vars:

    debug_display: true
    ansible_target_user: "{{ ansible_user | default(ansible_facts['user_id'] | default(ansible_env.USER | default('root'))) }}"
    set_zsh_shell: "{{ ansible_target_user != 'root' }}"


  tasks:

    - name: Display Ansible facts
      ansible.builtin.debug:
        msg:
          ansible_facts: "{{ ansible_facts }}"
      when: debug_display

    - name: Display Ansible env
      ansible.builtin.debug:
        msg:
          ansible_env: "{{ ansible_env }}"
      when: debug_display

    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Check whether Zsh is installed
      ansible.builtin.set_fact:
        zsh_is_installed: "{{ 'zsh' in ansible_facts.packages }}"

    - name: Install zsh
      when: not zsh_is_installed
      ansible.builtin.package:
          name: zsh
          state: present
          update_cache: true

    - name: Configure Zsh for the target user
      when: set_zsh_shell
      block:
        - name: Set the default shell for the target user to zsh
          ansible.builtin.user:
            name: "{{ ansible_target_user }}"
            shell: /usr/bin/zsh

        - name: Get target user home directory
          ansible.builtin.getent:
            database: passwd
            key: "{{ ansible_target_user }}"

        - name: Set target user home directory fact
          ansible.builtin.set_fact:
            ansible_target_home: "{{ ansible_facts.getent_passwd[ansible_target_user][4] }}"

        - name: Display ansible_target_home
          ansible.builtin.debug:
            msg:
              ansible_target_home: "{{ ansible_target_home }}"
          when: debug_display

        - name: Check whether Oh My Zsh is installed
          ansible.builtin.stat:
            path: "{{ ansible_target_home }}/.oh-my-zsh"
          register: ansible_target_ohmyzsh

        - name: Check whether target user's zsh configuration exists
          ansible.builtin.stat:
            path: "{{ ansible_target_home }}/.zshrc"
          register: ansible_target_zshrc

        - name: Install Oh My Zsh for the target user
          ansible.builtin.shell:
            cmd: 'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
          become: true
          become_user: "{{ ansible_target_user }}"
          environment:
            HOME: "{{ ansible_target_home }}"
            RUNZSH: "no"
            CHSH: "yes"
          when: not ansible_target_ohmyzsh.stat.exists

        - name: Create target user's zsh configuration from Oh My Zsh template
          ansible.builtin.copy:
            src: "{{ ansible_target_home }}/.oh-my-zsh/templates/zshrc.zsh-template"
            dest: "{{ ansible_target_home }}/.zshrc"
            remote_src: true
            owner: "{{ ansible_target_user }}"
            group: "{{ ansible_target_user }}"
            mode: "0600"
            force: false
          when: not ansible_target_zshrc.stat.exists

    - name: Check whether skel configuration exists
      ansible.builtin.stat:
        path: "/etc/skel/.zshrc"
      register: ansible_skel_zshrc

    - name: Create skel zsh configuration
      ansible.builtin.copy:
        src: "/etc/zsh/newuser.zshrc.recommended"
        dest: "/etc/skel/.zshrc"
        remote_src: true
        owner: "root"
        group: "root"
        mode: "0644"
        force: false
      when:
        - not ansible_skel_zshrc.stat.exists

    - name: Display Zsh target settings
      ansible.builtin.debug:
        msg:
          ansible_target_user: "{{ ansible_target_user }}"
          set_zsh_shell: "{{ set_zsh_shell }}"
      when: debug_display